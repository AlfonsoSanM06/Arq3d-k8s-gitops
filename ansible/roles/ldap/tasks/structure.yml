---
# Crea de forma idempotente el DIT usado por las aplicaciones.
- name: "LDAP DIT | Crear unidades organizativas"
  community.general.ldap_entry:
    dn: "ou={{ item }},{{ ldap_base_dn }}"
    objectClass: [organizationalUnit]
    attributes:
      ou: "{{ item }}"
      description: "OU gestionada por Ansible - ARQ3D"
    server_uri: "{{ ldap_server_uri }}"
    bind_dn: "cn=admin,{{ ldap_base_dn }}"
    bind_pw: "{{ ldap_admin_password }}"
    state: present
  loop: "{{ ldap_organizational_units }}"
  no_log: true

- name: "LDAP DIT | Crear grupos posixGroup"
  community.general.ldap_entry:
    dn: "cn={{ item.name }},ou=grupos,{{ ldap_base_dn }}"
    objectClass: [posixGroup, top]
    attributes:
      cn: "{{ item.name }}"
      gidNumber: "{{ 5000 + loop_index }}"
      description: "{{ item.description }}"
    server_uri: "{{ ldap_server_uri }}"
    bind_dn: "cn=admin,{{ ldap_base_dn }}"
    bind_pw: "{{ ldap_admin_password }}"
    state: present
  loop: "{{ ldap_groups }}"
  loop_control:
    index_var: loop_index
  no_log: true

- name: "LDAP DIT | Crear cuenta de servicio de bind"
  community.general.ldap_entry:
    dn: "cn={{ ldap_bind_user_cn }},ou={{ ldap_bind_user_ou }},{{ ldap_base_dn }}"
    objectClass: [inetOrgPerson, simpleSecurityObject]
    attributes:
      cn: "{{ ldap_bind_user_cn }}"
      sn: ServiceAccount
      userPassword: "{{ ldap_bind_password }}"
      description: "Cuenta de bind para aplicaciones"
    server_uri: "{{ ldap_server_uri }}"
    bind_dn: "cn=admin,{{ ldap_base_dn }}"
    bind_pw: "{{ ldap_admin_password }}"
    state: present
  no_log: true
