name: Infrastructure validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ci-validation
      AWS_SECRET_ACCESS_KEY: ci-validation
      AWS_EC2_METADATA_DISABLED: "true"
    strategy:
      matrix:
        directory:
          - terraform-proxmox
          - k8s-cluster/k8s_argocd/argocd_terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: ${{ matrix.directory }}

      - name: Init without backend
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.directory }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ matrix.directory }}

  ansible:
    name: Ansible validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: python -m pip install --upgrade ansible ansible-lint yamllint

      - name: Install required collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: YAML lint
        run: yamllint -d relaxed ansible

      - name: Ansible lint
        run: ansible-lint ansible

  helm:
    name: Helm validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Build chart dependencies
        run: helm dependency build k8s-cluster/wordpress/wordpress-mysql

      - name: Lint chart
        run: helm lint k8s-cluster/wordpress/wordpress-mysql

      - name: Render chart
        run: helm template wordpress k8s-cluster/wordpress/wordpress-mysql > /tmp/wordpress.yaml

  manifests:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install pyyaml

      - name: Validate YAML syntax
        run: |
          python - <<'PY'
          import pathlib
          import yaml

          paths = list(pathlib.Path("k8s-cluster/argocd-apps").rglob("*.yaml"))
          paths += list(pathlib.Path("k8s-cluster/k8s_argocd").rglob("*.yaml"))
          for path in paths:
              with path.open() as stream:
                  list(yaml.safe_load_all(stream))
          print("YAML syntax OK")
          PY
