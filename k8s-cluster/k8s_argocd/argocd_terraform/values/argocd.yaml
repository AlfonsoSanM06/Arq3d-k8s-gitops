# =============================================================================
# values/argocd.yaml — Configuración de ArgoCD para ARQ3D Systems
# Chart: argo-cd 7.x (ArgoCD v2.13.x)
# =============================================================================

# Con chart 7.x la imagen ya corresponde a v2.13.x por defecto.
# Solo sobreescribir si se necesita un parche específico:
# global:
#   image:
#     tag: "v2.13.5"

server:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Redis integrado (backend de caché de ArgoCD)
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
