apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mysql-subchart.fullname" . }}-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mysql-subchart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mysql-subchart.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: wordpress-dev
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 3306
